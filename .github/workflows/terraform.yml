name: Terraform CI-CD  # Terraform CI-CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  id-token: write

env:
  TF_WORKING_DIR: ./prepod

jobs:

  # ============================================================
  # STAGE 1 - SCAN
  # ============================================================
  scan:
    name: Terraform Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate


  # ============================================================
  # STAGE 2 - SECRET SCAN
  # ============================================================
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    needs: scan

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # STAGE 3 - TERRAFORM PLAN
  # ============================================================
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    needs: secret-scan

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # Check whether GitHub Secrets are available
      # --------------------------------------------------------
      - name: Check Azure Secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            echo "AZURE_CLIENT_ID is missing"
            exit 1
          else
            echo "AZURE_CLIENT_ID is available"
          fi

          if [ -z "${{ secrets.AZURE_CLIENT_SECRET }}" ]; then
            echo "AZURE_CLIENT_SECRET is missing"
            exit 1
          else
            echo "AZURE_CLIENT_SECRET is available"
          fi

          if [ -z "${{ secrets.AZURE_TENANT_ID }}" ]; then
            echo "AZURE_TENANT_ID is missing"
            exit 1
          else
            echo "AZURE_TENANT_ID is available"
          fi

          if [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "AZURE_SUBSCRIPTION_ID is missing"
            exit 1
          else
            echo "AZURE_SUBSCRIPTION_ID is available"
          fi

      # --------------------------------------------------------
      # Azure Authentication
      # --------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan

      # --------------------------------------------------------
      # Save Terraform Plan
      # --------------------------------------------------------
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan


  # ============================================================
  # STAGE 4 - TERRAFORM APPLY
  # ============================================================
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: plan

    # Apply only after push to main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # Azure Authentication
      # --------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      # --------------------------------------------------------
      # Download Plan Artifact
      # --------------------------------------------------------
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}

      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------
      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan